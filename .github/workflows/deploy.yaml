name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build React App
      run: npm run build

    - name: Deploy to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@4.1.0
      with:
        server: 195.35.44.227
        username: u316976659
        password: ${{ secrets.HOSTINGER_PASSWORD }}
        local-dir: ./build/
        remote-dir: /public_html/
        # Fresh sync-state filename: forces a clean full upload on the first Vite
        # deploy so it won't try to delete the old CRA "static/" folder (which caused
        # the previous 550 error). Future deploys sync incrementally against this file.
        state-name: .ftp-deploy-sync-state-vite.json
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/Assests/**
        dangerous-clean-slate: false

# You need to set the following secrets in your GitHub repository:
# - HOSTINGER_SERVER: Your Hostinger server address (e.g., www.yourdomain.com)
# - HOSTINGER_USERNAME: Your Hostinger FTP username
# - HOSTINGER_PASSWORD: Your Hostinger FTP password